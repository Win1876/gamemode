name: Build deb

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            meson \
            appstream \
            clang \
            clang-format \
            clang-tools \
            libdbus-1-dev \
            libinih-dev \
            libsystemd-dev \
            systemd-dev

      - name: Build
        env:
          CI: "true"
        run: |
          ./bootstrap.sh -Dwith-examples=true

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: |
            ./**/*.deb
